<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BrewFinder Admin Login</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                BrewFinder
            </div>

            <h1>Admin Login</h1>

            <p class="login-subtitle">
                Login to manage cafes and restaurants
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>


            <a href="index.html" class="back-link">
                ← Back to BrewFinder
            </a>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>
</html>
